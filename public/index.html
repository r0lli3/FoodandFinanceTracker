<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0E1216">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Food Tracker</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg" />
<link rel="apple-touch-icon" href="/icon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
  html, body {
    width: 100%; height: 100%; overscroll-behavior: none;
    background: #0E1216;
  }
  body {
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    color: #fff;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    font-variant-numeric: tabular-nums;
  }
  /* Anchored to the viewport rather than sized with vh/dvh — in an iOS
     standalone PWA with viewport-fit=cover, dvh can under-report and leave
     a dead band below the dock. inset:0 always covers exactly. */
  #app-root { position: fixed; inset: 0; overflow: hidden; }
  button { font-family: inherit; }
  input[type=number] { -moz-appearance: textfield; }
  input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  ::-webkit-scrollbar { display: none; }
</style>
</head>
<body>

<div id="app-root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<script src="theme.js"></script>
<script src="data.js"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
<script type="text/babel" src="sheets.jsx"></script>
<script type="text/babel" src="screen.jsx"></script>
<script type="text/babel">
  const root = ReactDOM.createRoot(document.getElementById('app-root'));
  root.render(<App/>);
</script>
</body>
</html>
